<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mechanical Engineering Decision Lab</title><style>*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;background:#f3f7fb;color:#20334a;margin:0;padding:18px;line-height:1.55}.app{max-width:850px;margin:auto;background:#fff;border:1px solid #d2dfeb;border-radius:16px;padding:24px;box-shadow:0 5px 18px #1d3a5614}h1{font-size:25px;color:#153b5e;margin:0 0 5px}h2{font-size:21px}small{color:#53687b}.progress{height:8px;background:#e4ecf3;border-radius:9px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#27806a;transition:width .2s}.choices{display:grid;gap:10px}.choice{font:inherit;text-align:left;cursor:pointer;border:2px solid #d3dfeb;background:#fff;border-radius:10px;padding:14px;color:#20334a}.choice:hover,.choice:focus-visible{border-color:#2879ac;background:#f0f7fc}.choice.correct{border-color:#288264;background:#eaf7f0}.choice.incorrect{border-color:#bd514a;background:#fff0ed}.feedback{padding:15px;background:#edf5fb;border-radius:10px;margin:16px 0}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.nav button{font:inherit;padding:11px 18px;border-radius:8px;border:0;background:#174e78;color:white;cursor:pointer}.nav button:disabled{background:#c7d1d9;cursor:default}.muted{font-size:13px;color:#5e7081}button:focus-visible{outline:3px solid #f2ac41;outline-offset:2px}</style></head><body><main class="app"><small>MECHANICAL ENGINEERING A · LESSON A1.1</small><h1>Mechanical Engineering Decision Lab</h1><p>Choose an answer to each scenario. You will receive immediate feedback. You can change your answer or try again at any time.</p><div class="progress" aria-label="Activity progress"><div class="fill" id="fill"></div></div><small id="count"></small><h2 id="title"></h2><p id="question"></p><div id="choices" class="choices"></div><div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div><div class="nav"><button id="prev">Previous</button><button id="next">Next scenario</button></div><p class="muted">Practice only. No name, written reflection, download, or submission required.</p></main><script>const questions=[{title:'Recognizing Mechanical Engineering',q:'A company is developing an automated loading machine. Which assignment is most directly a mechanical engineering design task?',a:['Developing a customer-order database','Calculating the thickness of a lifting arm to support a load','Creating an advertisement for the machine','Scheduling employee training'],correct:1,why:'Determining the required dimensions of a load-bearing component involves forces, material behavior, and mechanical design.'},{title:'Science or Engineering?',q:'A researcher measures how different plastics expand as temperature rises. What is the primary purpose of this work?',a:['Engineering design','Scientific investigation','Manufacturing scheduling','Product advertising'],correct:1,why:'The researcher is investigating a physical relationship. An engineer could later use the findings to design a component.'},{title:'Evaluating Evidence',q:'A new machine frame is lighter than the original. What evidence best supports approving it?',a:['The frame looks sturdy','The supplier says it is stronger','Calculations and controlled tests show it meets the required loads','The frame uses less material'],correct:2,why:'Measured performance and engineering calculations establish whether the lighter frame satisfies its requirements.'},{title:'Applying Scientific Knowledge',q:'An engineer uses measured thermal expansion data to design a joint that prevents damage as a machine heats up. What is the engineer doing?',a:['Applying science to a practical design problem','Investigating expansion without a practical goal','Replacing testing with appearance','Ignoring material properties'],correct:0,why:'Engineering design applies scientific knowledge to meet a practical need under real constraints.'},{title:'Choosing a Suitable Design',q:'A component must support at least 400 N and weigh no more than 1.5 kg. Which candidate qualifies?',a:['A: 520 N and 1.8 kg','B: 380 N and 1.2 kg','C: 450 N and 1.4 kg','D: 350 N and 1.0 kg'],correct:2,why:'Candidate C satisfies both requirements. A exceeds the mass limit, while B and D do not meet the load requirement.'},{title:'Research Finding or Engineering Solution?',q:'A team first measures how steel changes length with temperature. Later, it designs an expansion joint for a hot-water pipe. Which statement best describes these tasks?',a:['Both tasks are scientific investigations only','Measuring the relationship is scientific investigation; designing the joint is engineering','Both tasks are manufacturing scheduling','Designing the joint is scientific investigation; measuring the relationship is engineering'],correct:1,why:'Science seeks evidence about how the world behaves. Engineering applies that evidence to develop a solution that meets a practical need.'}];let index=0;let responses={};const $=id=>document.getElementById(id);function render(){const q=questions[index];$('title').textContent=q.title;$('question').textContent=q.q;$('count').textContent='Scenario '+(index+1)+' of '+questions.length+' · '+Object.keys(responses).length+' attempted';$('fill').style.width=(Object.keys(responses).length/questions.length*100)+'%';$('choices').replaceChildren();q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='choice';b.type='button';b.textContent=String.fromCharCode(65+i)+'. '+a;if(responses[index]===i)b.classList.add(i===q.correct?'correct':'incorrect');b.setAttribute('aria-pressed',responses[index]===i?'true':'false');b.addEventListener('click',()=>{responses[index]=i;render()});$('choices').append(b)});const answered=responses[index]!==undefined;$('feedback').hidden=!answered;if(answered){$('feedback').textContent=(responses[index]===q.correct?'Correct! ':'Not quite. ')+q.why}$('prev').disabled=index===0;$('next').textContent=index===questions.length-1?'Try again':'Next scenario'}$('prev').addEventListener('click',()=>{if(index>0){index--;render()}});$('next').addEventListener('click',()=>{if(index===questions.length-1){index=0;responses={}}else index++;render()});render();</script></body></html>
